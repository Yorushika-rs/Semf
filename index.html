<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Semáforos - Universidad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>SIMULADOR DE TRÁNSITO</h1>
      <div class="info-box">
        <p><strong>Actividad:</strong> Lógica de Semáforos (Asincronía JS)</p>
        <p><strong>Propósito:</strong> Demostrar la gestión de tiempos y estados mediante código.</p>
      </div>
    </header>

    <div class="dashboard">
      
      <div class="column">
        <button class="button" id="button1">CAMBIAR 1</button>
        <div class="semaforo">
          <div class="circle" id="red1"></div>
          <div class="circle" id="yellow1"></div>
          <div class="circle" id="green1"></div>
        </div>
      </div>

      <div class="column">
        <div class="peaton-card">
          <span class="label">PEATÓN</span>
          <div class="circle" id="color"></div>
        </div>
      </div>

      <div class="column">
        <button class="button" id="button2">CAMBIAR 2</button>
        <div class="semaforo">
          <div class="circle" id="red2"></div>
          <div class="circle" id="yellow2"></div>
          <div class="circle" id="green2"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
